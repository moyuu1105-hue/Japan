<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本攝影機位指南 · Japan Lens Guide</title>
  
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      /* 極簡日系清新調色盤 */
      --bg-main: #F9F8F6;          /* 暖白 / 米白 */
      --card-bg: #FFFFFF;          /* 純白 */
      --text-main: #2C2C2C;        /* 深灰黑 */
      --text-muted: #73706B;       /* 淺灰棕輔助文字 */
      --border-color: #ECE8E1;     /* 極細微邊框 */
      --wood: #A68A68;             /* 淺木色 / 莫蘭迪棕 */
      --wood-hover: #8E7353;       /* 深木色 */
      --wood-light: #F2ECE4;       /* 淺木色背襯 */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans TC", sans-serif;
      padding-bottom: 60px;
      -webkit-font-smoothing: antialiased;
    }
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(249, 248, 246, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      height: 64px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; max-width: 1100px; margin: 0 auto;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .icon-box {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--wood-light); color: var(--wood);
      display: flex; align-items: center; justify-content: center;
    }
    .title-area h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.6px; color: var(--text-main); }
    .title-area p { font-size: 11px; color: var(--text-muted); }
    .header-btns { display: flex; gap: 8px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; font-size: 12px; border-radius: 8px;
      border: 1px solid var(--border-color); background: var(--card-bg);
      color: var(--text-main); cursor: pointer; text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn:hover { background: #F3EFE9; border-color: #DFD9CF; }
    .btn-wood { background: var(--wood); color: #FFF; border: none; font-weight: 600; }
    .btn-wood:hover { background: var(--wood-hover); }
    .btn-edit { background: var(--wood-light); color: var(--text-main); border: 1px solid #DFD9CF; font-weight: 600; }
    .btn-edit:hover { background: #E7DFD4; }

    main { max-width: 1100px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 20px; }
    .section-card {
      background: var(--card-bg); border-radius: 16px;
      border: 1px solid var(--border-color); padding: 16px;
      box-shadow: 0 2px 10px rgba(44, 44, 44, 0.03);
    }
    .map-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    
    #map { 
      width: 100%; height: 360px; border-radius: 12px; 
      border: 1px solid var(--border-color); z-index: 10; position: relative; 
      background: #F4F3F0;
    }
    .leaflet-japanese-clean {
      filter: grayscale(88%) contrast(92%) brightness(104%);
    }

    .filter-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
    .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn {
      padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500;
      border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-muted); cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn.active { background: var(--text-main); color: #FFF; border-color: var(--text-main); }
    .search-input {
      padding: 7px 16px; border-radius: 20px; font-size: 12px;
      border: 1px solid var(--border-color); width: 100%; max-width: 240px; outline: none;
      background: var(--card-bg); color: var(--text-main);
    }
    .search-input:focus { border-color: var(--wood); }

    .grid-cards {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-color);
      overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 2px 8px rgba(44, 44, 44, 0.03); transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(44, 44, 44, 0.07); }
    .card-img-wrap {
      position: relative; height: 190px; background: #ECE8E1; cursor: pointer; overflow: hidden;
    }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
    .card:hover .card-img-wrap img { transform: scale(1.03); }
    .badge-index {
      position: absolute; top: 10px; left: 10px; width: 28px; height: 28px;
      border-radius: 50%; background: var(--wood); color: #FFF;
      font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center;
      border: 1.5px solid #FFF; box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }
    .badge-photos {
      position: absolute; bottom: 8px; right: 10px; padding: 2px 8px;
      border-radius: 12px; background: rgba(44, 44, 44, 0.65); backdrop-filter: blur(4px);
      color: #FFF; font-size: 11px;
    }
    .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
    .card-title { font-size: 14px; font-weight: 700; margin-top: 2px; letter-spacing: 0.3px; color: var(--text-main); }
    .card-address { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info-box {
      background: var(--bg-main); border-radius: 10px; padding: 8px 10px;
      font-size: 11px; display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--border-color);
    }
    .card-actions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }

    /* Modal 彈窗層級置頂 9999 */
    .modal-backdrop {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(44, 44, 44, 0.6);
      backdrop-filter: blur(5px);
      z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal-box {
      background: #FFFFFF; border-radius: 16px; width: 100%; max-width: 500px;
      max-height: 90vh; overflow-y: auto; padding: 22px;
      box-shadow: 0 20px 40px rgba(44, 44, 44, 0.25);
      position: relative; z-index: 10000;
    }
    .modal-head { 
      display: flex; justify-content: space-between; align-items: center; 
      margin-bottom: 14px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; 
    }
    .hidden { display: none !important; }

    /* 表單樣式 */
    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; position: relative; }
    .form-group label { font-size: 12px; font-weight: 600; color: var(--text-main); }
    .form-control {
      width: 100%; padding: 8px 12px; border-radius: 8px;
      border: 1px solid var(--border-color); font-size: 12px; outline: none;
      background: #FFFFFF; color: var(--text-main);
    }
    .form-control:focus { border-color: var(--wood); }

    /* 地址自動建議下拉選單 */
    .address-suggestions {
      position: absolute; top: calc(100% + 2px); left: 0; right: 0;
      background: #FFFFFF; border: 1px solid var(--border-color);
      border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      max-height: 180px; overflow-y: auto; z-index: 10005;
    }
    .suggestion-item {
      padding: 8px 12px; font-size: 11px; border-bottom: 1px solid #F5F3EF;
      cursor: pointer; color: var(--text-main);
    }
    .suggestion-item:hover { background: var(--bg-main); color: var(--wood-hover); }

    .photos-list {
      display: flex; flex-wrap: wrap; gap: 8px; min-height: 60px;
      background: var(--bg-main); padding: 8px; border-radius: 10px;
      border: 1px solid var(--border-color); margin-bottom: 8px;
    }
    .photo-item {
      position: relative; width: 64px; height: 64px; border-radius: 8px;
      overflow: hidden; border: 1px solid var(--border-color);
    }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; }
    .photo-del {
      position: absolute; top: 2px; right: 2px; background: rgba(225,29,72,0.85);
      color: #FFF; width: 18px; height: 18px; border-radius: 50%;
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px;
    }

    /* 莫蘭迪棕水滴圖釘 */
    .custom-pin {
      width: 32px; height: 32px; background: var(--wood); color: #FFF;
      border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(44, 44, 44, 0.22); border: 2px solid #FFF;
      transition: all 0.2s ease;
    }
    .custom-pin:hover {
      background: var(--wood-hover);
      transform: rotate(-45deg) scale(1.08);
    }
    .custom-pin span { transform: rotate(45deg); font-size: 12px; font-weight: 700; }

    /* Lightbox 導航按鈕樣式 */
    .lightbox-nav-btn {
      background: rgba(255,255,255,0.18); border: none; color: #FFF;
      width: 38px; height: 38px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; cursor: pointer;
      backdrop-filter: blur(4px); transition: background 0.2s;
    }
    .lightbox-nav-btn:hover { background: rgba(255,255,255,0.35); }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="icon-box"><i data-lucide="camera" style="width:18px;height:18px;"></i></div>
      <div class="title-area">
        <h1>JAPAN LENS GUIDE</h1>
        <p>東京 ＆ 富士山攝影機位指南</p>
      </div>
    </div>
    <div class="header-btns">
      <button onclick="getUserLocation()" id="locateBtn" class="btn">
        <i data-lucide="navigation" style="width:14px;height:14px;color:var(--wood);"></i>
        <span id="locateText">定位</span>
      </button>
      <button id="authBtn" onclick="handleAuthClick()" class="btn">
        <i data-lucide="lock" style="width:14px;height:14px;color:var(--wood);"></i>
        <span id="authBtnText">管理員</span>
      </button>
      <button id="backupBtn" onclick="openSyncModal()" class="btn hidden">
        <i data-lucide="download" style="width:14px;height:14px;color:var(--wood);"></i>
        <span>備份</span>
      </button>
      <button id="addSpotBtn" onclick="openEditModal(null)" class="btn btn-wood hidden">
        <i data-lucide="plus" style="width:14px;height:14px;"></i>
        <span>新增機位</span>
      </button>
    </div>
  </header>

  <main>
    <section class="section-card">
      <div class="map-header">
        <div>
          <h2 style="font-size:14px;font-weight:700;">機位分佈地圖</h2>
          <span style="font-size:11px;color:var(--text-muted);">極簡日系清新風格 · 標註行政區與機位</span>
        </div>
        <div style="display:flex;gap:6px;">
          <button onclick="focusAllSpots()" class="btn">全覽</button>
          <button onclick="focusRegion('fuji')" class="btn">富士山</button>
          <button onclick="focusRegion('tokyo')" class="btn">東京</button>
        </div>
      </div>
      <div id="map"></div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:8px;">
        <span>💡 點選卡片「在地圖查看」聚焦標記，點「Google 導航」開啟路線規劃。</span>
        <span id="spotCountText">載入中...</span>
      </div>
    </section>

    <div class="filter-bar">
      <div class="filter-group">
        <button onclick="setFilter('all')" class="filter-btn active" data-filter="all">全部機位</button>
        <button onclick="setFilter('fuji')" class="filter-btn" data-filter="fuji">富士山 / 河口湖</button>
        <button onclick="setFilter('tokyo')" class="filter-btn" data-filter="tokyo">東京市區</button>
      </div>
      <input type="text" id="searchInput" oninput="handleSearch()" placeholder="搜尋景點、鏡頭焦段..." class="search-input">
    </div>

    <div id="spotsGrid" class="grid-cards"></div>
  </main>

  <!-- 管理員認證彈窗 -->
  <div id="authModal" class="modal-backdrop hidden">
    <div class="modal-box" style="max-width:340px;text-align:center;">
      <div class="modal-head">
        <h3 style="font-size:15px;font-weight:700;">管理員模式</h3>
        <button onclick="closeAuthModal()" style="border:none;background:none;cursor:pointer;"><i data-lucide="x"></i></button>
      </div>
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:14px;">請輸入管理密碼：</p>
      <input type="password" id="authPassword" placeholder="輸入密碼" class="form-control" style="text-align:center;font-size:16px;letter-spacing:4px;margin-bottom:16px;" onkeydown="if(event.key==='Enter')verifyPassword()">
      <div style="display:flex;gap:8px;">
        <button onclick="closeAuthModal()" class="btn" style="flex:1;justify-content:center;">取消</button>
        <button onclick="verifyPassword()" class="btn btn-wood" style="flex:1;justify-content:center;">解鎖</button>
      </div>
    </div>
  </div>

  <!-- 編輯 / 新增機位彈窗 -->
  <div id="editModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle" style="font-size:15px;font-weight:700;">編輯機位</h3>
        <button onclick="closeEditModal()" style="border:none;background:none;cursor:pointer;"><i data-lucide="x"></i></button>
      </div>
      <input type="hidden" id="editSpotId">

      <div class="form-group">
        <label>機位名稱 *</label>
        <input type="text" id="editName" placeholder="例如：日川時計店" class="form-control">
      </div>

      <div class="form-group">
        <label>所屬分區</label>
        <select id="editRegion" class="form-control">
          <option value="fuji">富士山 / 河口湖</option>
          <option value="tokyo">東京市區</option>
          <option value="other">其他地點</option>
        </select>
      </div>

      <!-- 地址輸入與即時建議下拉 -->
      <div class="form-group">
        <label>地址或地標名稱（輸入後自動建議並換算經緯度）*</label>
        <input type="text" id="editAddress" placeholder="例如：山梨県富士吉田市下吉田３丁目５−１６ 或 日川時計店" class="form-control" oninput="handleAddressInput(event)" autocomplete="off">
        <div id="addressSuggestions" class="address-suggestions hidden"></div>
        <span id="geoStatusText" style="font-size:11px;color:var(--wood);margin-top:2px;"></span>
      </div>

      <div style="display:flex;gap:8px;">
        <div class="form-group" style="flex:1;">
          <label>緯度 (Lat)</label>
          <input type="number" step="any" id="editLat" placeholder="自動換算" class="form-control">
        </div>
        <div class="form-group" style="flex:1;">
          <label>經度 (Lng)</label>
          <input type="number" step="any" id="editLng" placeholder="自動換算" class="form-control">
        </div>
      </div>

      <div class="form-group">
        <label>推薦焦段</label>
        <input type="text" id="editLens" placeholder="例如：70-200mm 長焦壓縮" class="form-control">
      </div>

      <div class="form-group">
        <label>最佳拍攝時段</label>
        <input type="text" id="editTime" placeholder="例如：清晨 07:00 前（順光無人）" class="form-control">
      </div>

      <div class="form-group">
        <label>構圖心法與踩坑提醒</label>
        <textarea id="editNotes" rows="2" placeholder="注意事項..." class="form-control"></textarea>
      </div>

      <div class="form-group">
        <label>示範照片（支援多張上傳，自動壓縮）</label>
        <div id="photosList" class="photos-list"></div>
        <div style="display:flex;gap:6px;">
          <label class="btn" style="flex:1;justify-content:center;cursor:pointer;">
            <i data-lucide="image-plus" style="width:14px;height:14px;"></i>
            <span id="uploadLabelText">選擇手機/電腦相片</span>
            <input type="file" id="imageFileInput" accept="image/*" multiple class="hidden" onchange="handleImageUpload(event)">
          </label>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;border-top:1px solid var(--border-color);padding-top:12px;">
        <button type="button" id="deleteSpotBtn" onclick="deleteCurrentSpot()" class="btn hidden" style="color:#E11D48;border-color:#FECDD3;">刪除此機位</button>
        <div style="display:flex;gap:8px;margin-left:auto;">
          <button type="button" onclick="closeEditModal()" class="btn">取消</button>
          <button type="button" onclick="saveSpotData()" class="btn btn-wood">儲存機位</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 資料備份彈窗 -->
  <div id="syncModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 style="font-size:15px;font-weight:700;">資料備份與轉移</h3>
        <button onclick="closeSyncModal()" style="border:none;background:none;cursor:pointer;"><i data-lucide="x"></i></button>
      </div>
      <div style="font-size:12px;display:flex;flex-direction:column;gap:12px;">
        <div style="background:var(--bg-main);padding:12px;border-radius:10px;border:1px solid var(--border-color);">
          <p style="font-weight:700;margin-bottom:8px;">方式一：純文字一鍵備份（複製到 LINE 最方便）</p>
          <div style="display:flex;gap:8px;">
            <button onclick="copyBackupToClipboard()" class="btn" style="flex:1;justify-content:center;">📋 複製代碼</button>
            <button onclick="pasteBackupFromText()" class="btn btn-wood" style="flex:1;justify-content:center;">📥 貼上代碼同步</button>
          </div>
        </div>
        <div style="background:var(--bg-main);padding:12px;border-radius:10px;border:1px solid var(--border-color);">
          <p style="font-weight:700;margin-bottom:8px;">方式二：JSON 檔案備份</p>
          <div style="display:flex;gap:8px;">
            <button onclick="exportBackupData()" class="btn" style="flex:1;justify-content:center;">下載備份檔</button>
            <label class="btn" style="flex:1;justify-content:center;cursor:pointer;">
              <span>匯入備份檔</span>
              <input type="file" accept=".json" class="hidden" onchange="importBackupData(event)">
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Lightbox 大圖檢視（支援左滑/右滑切換、箭頭按鈕） -->
  <div id="lightboxModal" class="modal-backdrop hidden" style="background:rgba(44, 44, 44, 0.94);flex-direction:column;justify-content:space-between;color:#FFF;padding:12px 16px;">
    <div style="width:100%;max-width:850px;display:flex;justify-content:space-between;align-items:center;">
      <div>
        <h4 id="lightboxTitle" style="font-size:14px;font-weight:700;"></h4>
        <span id="lightboxIndex" style="font-size:12px;color:#AAA;"></span>
      </div>
      <button onclick="closeLightbox()" style="background:none;border:none;color:#FFF;cursor:pointer;"><i data-lucide="x"></i></button>
    </div>

    <!-- 圖片主體與左右切換導航按鈕 -->
    <div id="lightboxSwipeArea" style="width:100%;max-width:850px;position:relative;display:flex;align-items:center;justify-content:center;flex:1;touch-action:pan-y;">
      <button onclick="prevLightboxImage(event)" class="lightbox-nav-btn" style="position:absolute;left:8px;z-index:2;" title="上一張">
        <i data-lucide="chevron-left" style="width:22px;height:22px;"></i>
      </button>

      <div style="max-height:75vh;max-width:100%;display:flex;align-items:center;justify-content:center;">
        <img id="lightboxImg" src="" style="max-height:75vh;max-width:100%;object-fit:contain;border-radius:8px;user-select:none;pointer-events:none;">
      </div>

      <button onclick="nextLightboxImage(event)" class="lightbox-nav-btn" style="position:absolute;right:8px;z-index:2;" title="下一張">
        <i data-lucide="chevron-right" style="width:22px;height:22px;"></i>
      </button>
    </div>

    <p id="lightboxCaption" style="font-size:12px;color:#DDD;text-align:center;padding:4px 0;"></p>
  </div>

  <script>
    const DEFAULT_SPOTS = [
      {
        "id": "custom-1793374095735",
        "name": "ogino十字路口",
        "region": "fuji",
        "address": "山梨県南都留郡富士河口湖町船津３",
        "lat": 35.501753,
        "lng": 138.757509,
        "lens": "70-200mm 長焦壓縮視角",
        "bestTime": "清晨 06:00 - 10:00",
        "notes": "下吉田至河口湖間的開闊十字路口，長焦拍攝街景車流與雄偉雪頂富士山同框。",
        "images": ["https://images.unsplash.com/photo-1492571350019-22de08371fd3?auto=format&fit=crop&w=800&q=75"]
      },

    let spots = [];
    let map = null;
    let markersLayer = null;
    let currentFilter = 'all';
    let searchQuery = '';
    let isAdmin = false;
    let currentModalPhotos = [];
    let currentSpotIndex = 0;
    let currentSpot = null;
    let geoTimeout = null;

    window.addEventListener('DOMContentLoaded', () => {
      loadSpots();
      initMap();
      renderSpots();
      initLightboxSwipe();
      lucide.createIcons();
    });

    function loadSpots() {
      try {
        const saved = localStorage.getItem('japan_lens_spots_stable');
        if (saved && saved.startsWith('[')) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            spots = parsed.filter(s => s.id !== 'tokyo-shibuyasky');
            return;
          }
        }
      } catch (e) {}
      spots = [...DEFAULT_SPOTS];
      saveSpots();
    }

    function saveSpots() {
      try {
        localStorage.setItem('japan_lens_spots_stable', JSON.stringify(spots));
      } catch (e) {}
      updateCount();
    }

    function updateCount() {
      document.getElementById('spotCountText').textContent = `共標記 ${spots.length} 處攝影點`;
    }

    function initMap() {
      map = L.map('map', { zoomControl: true }).setView([35.5017, 138.7575], 11);
      
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap',
        className: 'leaflet-japanese-clean'
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
      renderMarkers();
    }

    function renderMarkers() {
      if (!markersLayer) return;
      markersLayer.clearLayers();
      spots.forEach((spot, i) => {
        if (!spot.lat || !spot.lng) return;
        const icon = L.divIcon({
          className: '',
          html: `<div class="custom-pin"><span>${i + 1}</span></div>`,
          iconSize: [32, 32],
          iconAnchor: [16, 32],
          popupAnchor: [0, -30]
        });
        const nav = `https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}`;
        
        let editBtnHtml = '';
        if (isAdmin) {
          editBtnHtml = `<button onclick="openEditModal('${spot.id}')" class="btn btn-edit" style="flex:1;padding:3px 6px;">編輯</button>`;
        }

        const popup = `
          <div style="font-size:12px;padding:4px;min-width:180px;">
            <p style="font-weight:700;color:var(--text-main);">#${i + 1} ${spot.name}</p>
            <p style="color:var(--text-muted);font-size:11px;margin:4px 0;">${spot.address || ''}</p>
            <div style="display:flex;gap:6px;margin-top:6px;">
              <button onclick="scrollToCard('${spot.id}')" class="btn" style="flex:1;padding:3px 6px;">卡片</button>
              ${editBtnHtml}
              <a href="${nav}" target="_blank" class="btn btn-wood" style="flex:1;padding:3px 6px;text-align:center;">導航</a>
            </div>
          </div>
        `;
        markersLayer.addLayer(L.marker([spot.lat, spot.lng], { icon }).bindPopup(popup));
      });
    }

    function renderSpots() {
      const container = document.getElementById('spotsGrid');
      container.innerHTML = '';
      let list = [...spots];
      if (currentFilter !== 'all') list = list.filter(s => s.region === currentFilter);
      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase();
        list = list.filter(s => (s.name && s.name.toLowerCase().includes(q)) || (s.address && s.address.toLowerCase().includes(q)));
      }

      list.forEach((spot, idx) => {
        const origIdx = spots.findIndex(s => s.id === spot.id);
        const cardNum = origIdx !== -1 ? origIdx + 1 : idx + 1;
        const cover = (spot.images && spot.images.length > 0) ? spot.images[0] : '';
        const nav = `https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}`;

        let adminActionHtml = '';
        if (isAdmin) {
          adminActionHtml = `<button onclick="openEditModal('${spot.id}')" class="btn btn-edit" style="flex:1;justify-content:center;">✏️ 編輯機位</button>`;
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${spot.id}`;
        card.innerHTML = `
          <div class="card-img-wrap" onclick="openLightbox('${spot.id}', 0)">
            <img src="${cover}" alt="${spot.name}">
            <div class="badge-index">${cardNum}</div>
            <div class="badge-photos">${spot.images ? spot.images.length : 0} 張照片</div>
          </div>
          <div class="card-body">
            <div>
              <span style="font-size:11px;color:var(--wood);font-weight:600;">#${cardNum} ${spot.region === 'fuji' ? '富士山 / 河口湖' : '東京市區'}</span>
              <h3 class="card-title">${spot.name}</h3>
              <p class="card-address">${spot.address || '日本'}</p>
            </div>
            <div class="info-box">
              <span>📷 <strong>${spot.lens || '標準變焦'}</strong></span>
              <span>⏰ ${spot.bestTime || '全天'}</span>
            </div>
            <div class="card-actions">
              <button onclick="focusSpot('${spot.id}')" class="btn" style="flex:1;justify-content:center;">在地圖查看</button>
              ${adminActionHtml}
              <a href="${nav}" target="_blank" class="btn btn-wood" style="flex:1;justify-content:center;">導航</a>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
      updateCount();
      lucide.createIcons();
    }

    function focusSpot(id) {
      const s = spots.find(x => x.id === id);
      if (s && map && s.lat && s.lng) {
        map.setView([s.lat, s.lng], 15);
        document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function scrollToCard(id) {
      const el = document.getElementById(`card-${id}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function focusAllSpots() {
      if (!map || spots.length === 0) return;
      const valid = spots.filter(s => s.lat && s.lng).map(s => [s.lat, s.lng]);
      if (valid.length > 0) map.fitBounds(L.latLngBounds(valid), { padding: [30, 30] });
    }

    function focusRegion(r) {
      if (!map) return;
      if (r === 'fuji') map.setView([35.5017, 138.7575], 11);
      else if (r === 'tokyo') map.setView([35.6812, 139.7671], 12);
    }

    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === f);
      });
      renderSpots();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value;
      renderSpots();
    }

    function getUserLocation() {
      if (!navigator.geolocation) return alert('不支援定位');
      document.getElementById('locateText').textContent = '定位中...';
      navigator.geolocation.getCurrentPosition(pos => {
        document.getElementById('locateText').textContent = '已定位';
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        L.circleMarker([lat, lng], { radius: 7, color: '#A68A68', fillColor: '#DFD5C7', fillOpacity: 0.9 }).addTo(map).bindPopup('您的位置').openPopup();
        map.setView([lat, lng], 13);
      }, () => {
        document.getElementById('locateText').textContent = '定位';
        alert('無法取得定位，請確認已開啟權限');
      });
    }

        if (confirm('確定退出管理員模式？')) {
          isAdmin = false;
          toggleAdminUI();
        }
      } else {
        document.getElementById('authModal').classList.remove('hidden');
        document.getElementById('authPassword').value = '';
        setTimeout(() => document.getElementById('authPassword').focus(), 100);
      }

    function closeAuthModal() {
      document.getElementById('authModal').classList.add('hidden');

    function verifyPassword() {
      if (document.getElementById('authPassword').value === '1030') {

    function toggleAdminUI() {
      document.getElementById('authBtnText').textContent = isAdmin ? '鎖定退出' : '管理員';
      document.getElementById('backupBtn').classList.toggle('hidden', !isAdmin);
      document.getElementById('addSpotBtn').classList.toggle('hidden', !isAdmin);
      renderSpots();
      renderMarkers();
      lucide.createIcons();
    }

    /* 需求 1：地址即時建議搜尋與換算經緯度 */
    function handleAddressInput(e) {
      const q = e.target.value.trim();
      const list = document.getElementById('addressSuggestions');
      const status = document.getElementById('geoStatusText');
      if (geoTimeout) clearTimeout(geoTimeout);

      if (q.length < 2) {
        list.innerHTML = '';
        list.classList.add('hidden');
        status.textContent = '';
        return;
      }

      status.textContent = '🔍 正在搜尋推薦地點與座標...';

      geoTimeout = setTimeout(async () => {
        try {
          // 呼叫 Nominatim 地理編碼 API (針對日本地點)
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=jp&limit=5&addressdetails=1`);
          const data = await res.json();
          list.innerHTML = '';

          if (data && data.length > 0) {
            status.textContent = '✓ 已找到地點建議，請點選：';
            data.forEach(item => {
              const div = document.createElement('div');
              div.className = 'suggestion-item';
              div.textContent = item.display_name;
              div.onclick = () => selectSuggestedAddress(item);
              list.appendChild(div);
            });
            list.classList.remove('hidden');
          } else {
            status.textContent = '未找到建議，可手動保留地址或填寫經緯度。';
            list.classList.add('hidden');
          }
        } catch (err) {
          status.textContent = '';
          list.classList.add('hidden');
        }
      }, 400);
    }

    function selectSuggestedAddress(item) {
      document.getElementById('editAddress').value = item.display_name;
      document.getElementById('editLat').value = parseFloat(item.lat).toFixed(6);
      document.getElementById('editLng').value = parseFloat(item.lon).toFixed(6);
      
      const list = document.getElementById('addressSuggestions');
      list.innerHTML = '';
      list.classList.add('hidden');
      document.getElementById('geoStatusText').textContent = `✓ 座標已自動換算：${parseFloat(item.lat).toFixed(4)}, ${parseFloat(item.lon).toFixed(4)}`;
    }

    function openEditModal(spotId) {
      if (!isAdmin) return alert('需要管理員權限');
      document.getElementById('editModal').classList.remove('hidden');
      const deleteBtn = document.getElementById('deleteSpotBtn');
      document.getElementById('uploadLabelText').textContent = '選擇手機/電腦相片';

        document.getElementById('modalTitle').textContent = `編輯機位：${spot.name}`;
        document.getElementById('editSpotId').value = spot.id;
        document.getElementById('editName').value = spot.name || '';
        document.getElementById('editRegion').value = spot.region || 'tokyo';
        document.getElementById('editAddress').value = spot.address || '';
        document.getElementById('editLat').value = spot.lat || '';
        document.getElementById('editLng').value = spot.lng || '';
        document.getElementById('editLens').value = spot.lens || '';
        document.getElementById('editTime').value = spot.bestTime || '';
        document.getElementById('editNotes').value = spot.notes || '';

        document.getElementById('modalTitle').textContent = '新增攝影機位';
        document.getElementById('editSpotId').value = '';
        document.getElementById('editName').value = '';
        document.getElementById('editRegion').value = 'fuji';
        document.getElementById('editAddress').value = '';
        document.getElementById('editLat').value = '';
        document.getElementById('editLng').value = '';
        document.getElementById('editLens').value = '';
        document.getElementById('editTime').value = '';
        document.getElementById('editNotes').value = '';
        currentModalPhotos = [];
        deleteBtn.classList.add('hidden');
      }
      renderModalPhotos();
      lucide.createIcons();
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    function deleteCurrentSpot() {
      if (!isAdmin) return;
      const id = document.getElementById('editSpotId').value;
      if (confirm('確定要刪除此機位嗎？')) {
        spots = spots.filter(s => s.id !== id);
        saveSpots();
        renderMarkers();
        renderSpots();
        closeEditModal();
      }
    }

    /* 需求 1：儲存新機位時，將其立即標記在地圖上並自動平移聚焦 */
    function saveSpotData() {
      const id = document.getElementById('editSpotId').value;
      const name = document.getElementById('editName').value.trim();
      const region = document.getElementById('editRegion').value;
      const address = document.getElementById('editAddress').value.trim();
      let lat = parseFloat(document.getElementById('editLat').value);
      let lng = parseFloat(document.getElementById('editLng').value);
      const lens = document.getElementById('editLens').value.trim();
      const bestTime = document.getElementById('editTime').value.trim();
      const notes = document.getElementById('editNotes').value.trim();

      if (!name) return alert('請填寫機位名稱');

      if (isNaN(lat) || isNaN(lng)) {
        lat = region === 'fuji' ? 35.5017 : 35.6812;
        lng = region === 'fuji' ? 138.7575 : 139.7671;
      }

      const spotData = {
        id: id || ('custom-' + Date.now()),
        name, region, address, lat, lng, lens, bestTime, notes,
        images: currentModalPhotos.length > 0 ? [...currentModalPhotos] : ["https://images.unsplash.com/photo-1492571350019-22de08371fd3?auto=format&fit=crop&w=800&q=75"]
      };

      if (id) {
        const idx = spots.findIndex(s => s.id === id);
        if (idx !== -1) spots[idx] = spotData;
      } else {
        spots.unshift(spotData);
      }

      saveSpots();
      renderMarkers();
      renderSpots();
      closeEditModal();

      // 地圖視野立即平移聚焦至新機位圖釘
      if (map && lat && lng) {
        map.setView([lat, lng], 15);
      }

      alert(`機位「${name}」已成功儲存並標示於地圖！`);
    }

    function renderModalPhotos() {
      const container = document.getElementById('photosList');
      container.innerHTML = '';
      if (currentModalPhotos.length === 0) {
        container.innerHTML = '<span style="font-size:11px;color:var(--text-muted);align-self:center;">目前無照片</span>';
        return;
      }
      currentModalPhotos.forEach((src, i) => {
        const div = document.createElement('div');
        div.className = 'photo-item';
        div.innerHTML = `
          <img src="${src}">
          <button type="button" class="photo-del" onclick="removePhoto(${i})">✕</button>
        `;
        container.appendChild(div);
      });
    }

    function removePhoto(idx) {
      currentModalPhotos.splice(idx, 1);
      renderModalPhotos();
    }

    function handleImageUpload(e) {
      const files = e.target.files;
      const label = document.getElementById('uploadLabelText');
      if (!files || files.length === 0) {
        label.textContent = '選擇手機/電腦相片';
        return;
      }

      label.textContent = '正在壓縮照片...';

      let processed = 0;
      const total = files.length;

      const checkFinished = () => {
        processed++;
        if (processed >= total) {
          renderModalPhotos();
          label.textContent = '✓ 上傳成功（可繼續選擇）';
          setTimeout(() => {
            if (label.textContent === '✓ 上傳成功（可繼續選擇）') {
              label.textContent = '選擇手機/電腦相片';
            }
          }, 2500);
          e.target.value = '';
        }
      };

      Array.from(files).forEach(file => {
        if (!file.type.startsWith('image/')) {
          checkFinished();
          return;
        }

        const reader = new FileReader();
        reader.onerror = () => checkFinished();
        reader.onload = ev => {
          const img = new Image();
          img.onerror = () => checkFinished();
          img.onload = () => {
            try {
              const max = 700;
              let w = img.width, h = img.height;
              if (w > max || h > max) {
                if (w > h) { h = Math.round((h * max) / w); w = max; }
                else { w = Math.round((w * max) / h); h = max; }
              }
              const canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
              currentModalPhotos.push(dataUrl);
            } catch (err) {
              console.error(err);
            }
            checkFinished();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function openSyncModal() {
      if (!isAdmin) return alert('需要管理員權限');
      document.getElementById('syncModal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeSyncModal() {
      document.getElementById('syncModal').classList.add('hidden');
    }

    function copyBackupToClipboard() {
      navigator.clipboard.writeText(JSON.stringify(spots)).then(() => alert('已複製備份代碼！'));
    }

    function pasteBackupFromText() {
      const modal = document.createElement('div');
      modal.className = 'modal-backdrop';
      modal.style.zIndex = '10002';
      modal.innerHTML = `
        <div class="modal-box" style="max-width:400px;">
          <h3 style="font-size:15px;font-weight:700;margin-bottom:10px;">貼上備份代碼</h3>
          <textarea id="pasteArea" rows="6" placeholder="請在此長按並貼上整段代碼..." class="form-control" style="font-size:11px;word-break:break-all;"></textarea>
          <div style="display:flex;gap:8px;margin-top:12px;">
            <button id="cancelPaste" class="btn" style="flex:1;justify-content:center;">取消</button>
            <button id="confirmPaste" class="btn btn-wood" style="flex:1;justify-content:center;">確認同步</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);

      modal.querySelector('#cancelPaste').onclick = () => modal.remove();
      modal.querySelector('#confirmPaste').onclick = () => {
        const text = modal.querySelector('#pasteArea').value.trim();
        if (!text) return alert('內容不能為空');
        try {
          const data = JSON.parse(text);
          if (Array.isArray(data)) {
            spots = data;
            saveSpots();
            renderMarkers();
            renderSpots();
            modal.remove();
            closeSyncModal();
            alert('同步成功！照片與機位已更新。');
          } else {
            alert('代碼格式不符');
          }
        } catch (e) {
          alert('解析失敗：代碼不完整或被截斷，請嘗試改用「JSON 檔案匯入」。');
        }
      };
    }

    function exportBackupData() {
      const blob = new Blob(["\uFEFF" + JSON.stringify(spots, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `japan_spots_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importBackupData(e) {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        try {
          const d = JSON.parse(ev.target.result);
          if (Array.isArray(d)) {
            spots = d;
            saveSpots();
            renderMarkers();
            renderSpots();
            closeSyncModal();
            alert('匯入成功！');
          }
        } catch(err) { alert('解析失敗'); }
      };
      r.readAsText(f);
    }

    /* 需求 2：Lightbox 大圖預覽、左滑下一張、右滑上一張與按鈕控制 */
    function openLightbox(id, idx) {
      const s = spots.find(x => x.id === id);
      if (!s || !s.images || s.images.length === 0) return;
      currentSpot = s;
      currentSpotIndex = idx;
      updateLightboxDisplay();
      document.getElementById('lightboxModal').classList.remove('hidden');
      lucide.createIcons();
    }

    function updateLightboxDisplay() {
      if (!currentSpot || !currentSpot.images) return;
      document.getElementById('lightboxTitle').textContent = currentSpot.name;
      document.getElementById('lightboxIndex').textContent = `${currentSpotIndex + 1} / ${currentSpot.images.length}`;
      document.getElementById('lightboxImg').src = currentSpot.images[currentSpotIndex];
      document.getElementById('lightboxCaption').textContent = currentSpot.notes || '';
    }

    function nextLightboxImage(e) {
      if (e) e.stopPropagation();
      if (!currentSpot || !currentSpot.images) return;
      currentSpotIndex = (currentSpotIndex + 1) % currentSpot.images.length;
      updateLightboxDisplay();
    }

    function prevLightboxImage(e) {
      if (e) e.stopPropagation();
      if (!currentSpot || !currentSpot.images) return;
      currentSpotIndex = (currentSpotIndex - 1 + currentSpot.images.length) % currentSpot.images.length;
      updateLightboxDisplay();
    }

    function closeLightbox() {
      document.getElementById('lightboxModal').classList.add('hidden');
    }

    // 觸控手勢監聽：左滑下一張、右滑上一張
    function initLightboxSwipe() {
      const area = document.getElementById('lightboxSwipeArea');
      let touchStartX = 0;
      let touchEndX = 0;

      area.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      area.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipeGesture();
      }, { passive: true });

      function handleSwipeGesture() {
        const threshold = 45; // 滑動距離門檻
        if (touchEndX < touchStartX - threshold) {
          // 向左滑動 -> 下一張
          nextLightboxImage();
        } else if (touchEndX > touchStartX + threshold) {
          // 向右滑動 -> 上一張
          prevLightboxImage();
        }
      }

      // 支援鍵盤左右箭頭切換
      window.addEventListener('keydown', e => {
        const modal = document.getElementById('lightboxModal');
        if (modal && !modal.classList.contains('hidden')) {
          if (e.key === 'ArrowRight') nextLightboxImage();
          else if (e.key === 'ArrowLeft') prevLightboxImage();
          else if (e.key === 'Escape') closeLightbox();
        }
      });
    }
  </script>
